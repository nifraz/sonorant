[package]
name = "sonorant-platform"
description = "Sonorant's audio capture and now-playing sources for Linux (PipeWire, MPRIS) and Windows (WASAPI, SMTC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sonorant-core = { workspace = true }
log = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
# #[implement] expands to paths in windows-core.
windows-core = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Optional so the MPRIS code can be type-checked on a machine with no PipeWire
# headers: `--no-default-features` for the Linux target leaves capture out. Builds
# and CI always have it on.
pipewire = { workspace = true, optional = true }
zbus = { workspace = true }

[features]
default = ["capture"]
# PipeWire capture. Needs the PipeWire development headers to build.
capture = ["dep:pipewire"]

[lints]
workspace = true
