ShortDescription: Real-time spectrogram, spectrum and loudness visualiser
Description: |-
  Sonorant draws what the computer is playing: a scrolling spectrogram of both
  channels, the spectrum beside it, and broadcast loudness, true peak, dynamic range,
  tempo and brightness underneath. It captures the whole system or one app through
  WASAPI loopback, and follows whatever player is running through the system media
  transport controls.

  It is the standalone rewrite of the Nostalgia+ plugin for MusicBee, drawn on the GPU
  with its own shaders.
