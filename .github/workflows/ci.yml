name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # PipeWire's headers for capture, and what winit needs to open Wayland and X11.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      # Installs the version rust-toolchain.toml names, with rustfmt and clippy.
      - name: Toolchain
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: Licences and advisories
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  packaging:
    name: Packaging metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils

      # The desktop entry and the AppStream description are what GNOME Software and
      # Flathub read; a mistake in either shows up as an app with no icon or no
      # listing, which no Rust test would catch. No network: the screenshots are
      # fetched from the branch this is checking, which may not be pushed yet.
      - name: Desktop entry and AppStream
        run: |
          desktop-file-validate packaging/linux/io.github.nifraz.Sonorant.desktop
          appstreamcli validate --no-net --strict --explain \
            packaging/linux/io.github.nifraz.Sonorant.metainfo.xml

      # A Flatpak build has no network, so its crate list is generated from Cargo.lock
      # and committed. A dependency bump that forgets it would fail deep inside a
      # Flathub build instead of here.
      - name: Flatpak sources
        run: python3 packaging/flatpak/cargo-sources.py --check
